bundle:
  name: retaildata-platform-mentor

include:
  - resources/*.yml

sync:
  include:
    - common_utils/**
    - src/**

variables:
  catalog:
    description: Unity Catalog catalog for the retail data platform.
    default: retaildata_platform

  secret_scope:
    description: Databricks secret scope containing source credentials.
    default: retail-platform-dev

  alert_email:
    description: Mailbox notified on job failure or SLA breach.
    default: moshiur.mubin0@gmail.com

  schedule_pause_status:
    description: PAUSED in non-production targets so only production runs on schedule.
    default: PAUSED

  run_as_service_principal:
    description: Service principal used by the production job.
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8fd5989c-f9ed.cloud.databricks.com
    variables:
      secret_scope: retail-platform-dev

  prod:
    mode: production
    workspace:
      host: https://dbc-8fd5989c-f9ed.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      secret_scope: retail-platform-prod
      schedule_pause_status: UNPAUSED